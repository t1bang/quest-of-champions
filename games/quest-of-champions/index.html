<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0e">
<title>Quest of Champions</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one fixed landscape stage, canvas letterboxed inside, touch controls overlaid on the canvas */
:root{
  --bg:#0b0b0e; --fg:#f4f1ee; --red:#e0202a; --red-deep:#8f0d14; --gold:#f2c94c; --panel:#15151b;
  --font-display:'Bangers','Impact','Arial Narrow',sans-serif;
  --font-body:'Rubik','Helvetica Neue',Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);overflow:hidden;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg)}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;background:#000}
#rotate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:var(--bg);z-index:50;text-align:center;padding:0 24px}
#rotate h1{font-family:var(--font-display);font-size:42px;letter-spacing:2px;color:var(--red);margin:0}
#rotate p{margin:0;opacity:.8}
@media (orientation:portrait) and (max-width:700px){#rotate{display:flex}}
#linkbar{position:fixed;inset:0;z-index:40;display:none;pointer-events:none}
#linkbar a{position:absolute;display:flex;align-items:center;justify-content:center;pointer-events:auto;font-family:var(--font-display);letter-spacing:1px;text-decoration:none;color:#111;background:var(--gold);border-radius:999px;box-shadow:0 3px 0 #a3801e;white-space:nowrap;overflow:hidden}
#vid{position:fixed;display:none;z-index:45;background:#000;border:3px solid var(--gold);border-radius:8px}
#linkbar a:focus-visible{outline:3px solid #fff}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Rubik:wght@400;700&display=swap">
</head>
<body>
<div id="rotate"><h1>TURN YOUR PHONE</h1><p>Quest of Champions plays in landscape. Rotate sideways to start.</p></div>
<div id="stage"><canvas id="c" width="960" height="540"></canvas></div>
<div id="linkbar"></div>
<video id="vid" playsinline controls preload="none"></video>
<audio id="music" preload="auto"></audio>
<script>
// ============================================================
//  RING CHASER — Tone Da Boss side-scroller
//  Vanilla canvas, no libraries. All sprites drawn procedurally.
// ============================================================
// ============================================================
//  QUEST OF CHAMPIONS — Tone Da Boss beat 'em up
//  Vanilla canvas, no libraries. Painted sprites where supplied, code-drawn otherwise.
// ============================================================
const W=960,H=540,GROUND=470,ZMIN=GROUND-130,ZMAX=GROUND,LANE=26;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const music=document.getElementById('music');
const linkbar=document.getElementById('linkbar');

// ---- CONFIG: paste real links here ----
const SONG_START={1:15.0,2:0,3:0};           // where each level's song starts (seconds)
const MENU_SONG='audio/champions.mp3';        // "Champions": main menu + every intro animation
const CHAMPIONS_CHORUS=11.0;                  // seconds — where "we the champions" hits
const VIDEO_LINKS={
  1:'https://www.youtube.com/results?search_query=Tone+Da+Boss+Give+Me+My+Ring',
  2:'https://x.com/SportKC/status/1626070071842942976/video/1',
  3:'https://www.youtube.com/results?search_query=Tone+Da+Boss+Showtime'};
const EMBED_VIDEO={2:'video/victory_lap.mp4'};   // plays on the level's victory screen
const STREAM_LINKS={spotify:'https://open.spotify.com/artist/0INF89wwzGt2GtRrUKrhii',apple:'https://music.apple.com/us/artist/tone-da-boss/318112377',
  amazon:'https://music.amazon.com/tracks/B0GQ5LKH7V',soundcloud:'https://m.soundcloud.com/tonedaboss/victory-lap',songlink:'https://song.link/us/i/1656794040'};
const SOCIALS={instagram:'https://www.instagram.com/djtonedaboss/',tiktok:'https://www.tiktok.com/@tonedaboss'};
const PRESS_LINK='https://www.kcrg.com/2022/06/27/cedar-rapids-artist-writes-hits-keegan-murray-golden-state-warriors-more/';
// Per-character links (used by the Select menu for whoever is picked)
const CHAR_LINKS={
  tone:{instagram:SOCIALS.instagram,tiktok:SOCIALS.tiktok,spotify:STREAM_LINKS.spotify,apple:STREAM_LINKS.apple},
};

// ---------------- scaling / input ----------------
let scale=1,offX=0,offY=0;
function resize(){const vw=window.innerWidth,vh=window.innerHeight;scale=Math.min(vw/W,vh/H);cv.style.width=(W*scale)+'px';cv.style.height=(H*scale)+'px';const r=cv.getBoundingClientRect();offX=r.left;offY=r.top;}
window.addEventListener('resize',resize);resize();
const keys={};
window.addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter'].includes(e.code))e.preventDefault();});
window.addEventListener('keyup',e=>{keys[e.code]=false;});
const BTN={
  left:{x:16,y:400,w:72,h:72,label:'◀'}, right:{x:168,y:400,w:72,h:72,label:'▶'},
  up:{x:92,y:330,w:72,h:66,label:'▲'}, down:{x:92,y:474,w:72,h:62,label:'▼'},
  jump:{x:862,y:418,w:84,h:84,label:'JUMP',c:'#3d7bf5'},
  punch:{x:764,y:452,w:80,h:80,label:'PUNCH',c:'#e0202a'},
  kick:{x:778,y:346,w:80,h:80,label:'KICK',c:'#f28a1a'},
  duck:{x:672,y:452,w:80,h:80,label:'DUCK',c:'#8d5a3b'},
  a1:{x:400,y:4,w:120,h:32,label:'A1',c:'#f2c94c'},
  a2:{x:528,y:4,w:120,h:32,label:'A2',c:'#f2c94c'},
  turbo:{x:724,y:4,w:104,h:32,label:'TURBO',c:'#ff6a00'},
  start:{x:262,y:480,w:120,h:48,label:'START'},
  select:{x:398,y:480,w:120,h:48,label:'SELECT'},
  mute:{x:W-292,y:6,w:48,h:30,label:'♪'},
};
const touchHeld={};const activeTouches={};
function hitBtn(lx,ly){for(const k in BTN){const b=BTN[k];if(lx>=b.x-6&&lx<=b.x+b.w+6&&ly>=b.y-6&&ly<=b.y+b.h+6)return k;}return null;}
function toLogical(t){return [(t.clientX-offX)/scale,(t.clientY-offY)/scale];}
function recomputeHeld(){for(const k in BTN)touchHeld[k]=false;for(const id in activeTouches){const k=activeTouches[id];if(k)touchHeld[k]=true;}}
const edges={};function pressEdge(k){edges[k]=true;}
let tapQueue=[];function tapAnywhere(x,y){tapQueue.push([x,y]);}
cv.addEventListener('touchstart',e=>{e.preventDefault();for(const tc of e.changedTouches){const [x,y]=toLogical(tc);let k=(state==='play')?hitBtn(x,y):null;if(!k){const kk=hitBtn(x,y);if(kk==='mute'||((state==='paused'||state==='selectmenu')&&(kk==='start'||kk==='select')))k=kk;}activeTouches[tc.identifier]=k;if(k)pressEdge(k);else tapAnywhere(x,y);}recomputeHeld();},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();for(const tc of e.changedTouches){const [x,y]=toLogical(tc);if(activeTouches[tc.identifier]!==null&&activeTouches[tc.identifier]!==undefined)activeTouches[tc.identifier]=hitBtn(x,y);}recomputeHeld();},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();for(const tc of e.changedTouches)delete activeTouches[tc.identifier];recomputeHeld();},{passive:false});
cv.addEventListener('touchcancel',e=>{for(const tc of e.changedTouches)delete activeTouches[tc.identifier];recomputeHeld();});
cv.addEventListener('mousedown',e=>{const [x,y]=toLogical(e);let k=(state==='play')?hitBtn(x,y):null;if(!k){const kk=hitBtn(x,y);if(kk==='mute'||((state==='paused'||state==='selectmenu')&&(kk==='start'||kk==='select')))k=kk;}if(k){touchHeld[k]=true;pressEdge(k);}else tapAnywhere(x,y);});
cv.addEventListener('mouseup',()=>{for(const k in BTN)touchHeld[k]=false;});
function held(k){
  if(touchHeld[k])return true;
  switch(k){case'left':return keys.ArrowLeft||keys.KeyA;case'right':return keys.ArrowRight||keys.KeyD;case'up':return keys.ArrowUp||keys.KeyW;case'down':return keys.ArrowDown;
    case'jump':return keys.Space;case'punch':return keys.KeyJ||keys.KeyZ;case'kick':return keys.KeyK||keys.KeyX;case'duck':return keys.KeyS||keys.KeyC;
    case'a1':return keys.KeyU||keys.Digit1;case'a2':return keys.KeyI||keys.Digit2;case'start':return keys.Enter||keys.KeyP;case'mute':return keys.KeyM;case'turbo':return keys.KeyT;case'select':return keys.ShiftLeft||keys.ShiftRight||keys.Escape;}
  return false;
}
const prevHeld={};
function pressed(k){return (held(k)||edges[k])&&!prevHeld[k];}
function released(k){return !held(k)&&!edges[k]&&prevHeld[k];}
function endFrameInput(){for(const k in BTN)prevHeld[k]=held(k)||edges[k];for(const k in edges)edges[k]=false;}
// ---------------- helpers ----------------
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function text(s,x,y,size,c,align='left',font='display'){ctx.font=`${size}px ${font==='display'?"'Bangers','Impact',sans-serif":"'Rubik',Arial,sans-serif"}`;ctx.fillStyle=c;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(s,x,y);}
function outlined(s,x,y,size,c,align='center'){ctx.font=`${size}px 'Bangers','Impact',sans-serif`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.lineWidth=Math.max(3,size/9);ctx.strokeStyle='#000';ctx.strokeText(s,x,y);ctx.fillStyle=c;ctx.fillText(s,x,y);}

// ---------------- sprite system ----------------
// A parametric pixel human. All measurements in a 48px-tall body at scale 1; drawn at `s` scale.
// opts: skin, hair:{type,color,tip}, hat:{type,color}, top, topAccent, pants, boots, gloves, jersey:{number,color,text}, face:{beard,shades,ring}, size
function drawHuman(x,y,o,anim){
  // Chibi outlined pixel sprite. Units: feet at 0, head top ~ -46. Drawn at scale s.
  const s=o.size||3, f=anim||{};
  const walk=f.walk||0, atk=f.attack||0, kick=f.kick||0, air=f.air||false, hurt=f.hurt||false, flame=f.flame||false, crouch=f.crouch||0;
  const flip=f.face<0;const scared=f.scared;
  ctx.save();ctx.translate(Math.round(x),Math.round(y));ctx.scale(s*(flip?-1:1),s);
  const OL='#0e0a0a';
  const R=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h);};
  const O=(x,y,w,h,c)=>{R(x-1,y-1,w+2,h+2,OL);R(x,y,w,h,c);}; // outlined block
  const sh=(c,k)=>{const n=parseInt(c.slice(1),16);const r=Math.max(0,((n>>16)&255)*k)|0,g=Math.max(0,((n>>8)&255)*k)|0,b=Math.max(0,(n&255)*k)|0;return `rgb(${r},${g},${b})`;};
  const skin=o.skin||'#8d5a3b', big=o.big, pantC=o.pants||'#1b1b1b', bootC=o.boots||'#2a2a2a', topC=hurt?'#ffffff':(o.top||'#444');
  const hairC=(o.hair&&o.hair.color)||'#1a1a1a';
  const tw=big?20:(o.female?13:16), th=big?16:14;           // torso
  const headW=big?16:15, headH=14;
  const legW=o.wide?(o.female?9:8):6, legH=12;
  const stride=air?3:Math.sin(walk)*4;
  const bob=air?0:Math.abs(Math.cos(walk))*1;
  const torsoY=-legH-th-2+crouch*3;
  const headY=torsoY-headH-1;
  // ---- dreads behind head (drawn before head so head overlaps)
  const hr=o.hair||{};const headY0=headY;
  if(hr.type==='dreads'){const len=hr.len||18,tip=hr.tip||'#e0202a';
    for(let i=0;i<7;i++){const dx=-tw/2-3+i*(tw+6)/6-1;const sway=Math.round(Math.sin(walk*0.7+i)*1);const L=len-(i===0||i===6?4:0)+(i%2?2:0);
      O(dx+sway,headY+5,2,L,hairC);R(dx+sway,headY+5+L-5,2,5,tip);}}
  if(hr.type==='long'){O(-headW/2-2,headY+2,3,16,hairC);O(headW/2-1,headY+2,3,16,hairC);}
  if(o.coat){O(-tw/2-2,torsoY+2,tw+4,th+legH-4,o.coat);R(-tw/2-2,torsoY+th,tw+4,1,'#2a2a2a');}
  // ---- back arm (behind torso)
  const armY=torsoY+2;
  O(-tw/2-3,armY,4,9,hurt?'#fff':(o.sleeve||topC));O(-tw/2-3,armY+9,4,4,o.gloves||skin);
  // ---- legs
  const backLeg=-stride*0.6, frontLeg=stride;
  O(-legW+1+backLeg*0.5,-legH,legW,legH-3,pantC);
  O(-legW+backLeg,-5,legW+2,5,bootC);R(-legW+backLeg,-1,legW+2,1,sh(bootC,0.6));
  if(kick>0){
    ctx.save();ctx.translate(1,-legH+1);ctx.rotate(-1.15*kick);
    O(0,0,legW,legH,pantC);O(-1,legH-2,legW+4,5,bootC);
    if(flame||o.fireFoot){R(-3,legH+3,legW+8,4,'#ff6a00');R(-1,legH+1,legW+5,3,'#ffd23f');R(legW+3,legH-1,4,8,'#ff3b00');}
    ctx.restore();
  }else{
    O(1+frontLeg*0.5,-legH,legW,legH-3,pantC);
    if(o.cargo)R(2+frontLeg*0.5,-legH+4,3,3,sh(pantC,0.6));
    O(0+frontLeg,-5,legW+2,5,bootC);R(0+frontLeg,-1,legW+2,1,sh(bootC,0.6));
    if(o.fireFoot){R(0+frontLeg,-7,legW+3,2,'#ff6a00');R(2+frontLeg,-8,legW-1,1,'#ffd23f');}
  }
  // ---- torso
  O(-tw/2,torsoY,tw,th,topC);
  R(-tw/2,torsoY+th-3,tw,3,sh(topC,0.75));
  if(o.hood){R(-tw/2+2,torsoY-1,tw-4,3,o.hood);R(-tw/2+1,torsoY,tw-2,1,OL);}
  if(o.jersey){const j=o.jersey;R(-tw/2+3,torsoY+1,tw-6,th-4,j.color);R(-tw/2+3,torsoY+1,tw-6,1,sh(j.color,0.8));
    ctx.save();ctx.scale((flip?-1:1)/s,1/s);ctx.font=`bold ${Math.round(7*s)}px 'Bangers',Impact,sans-serif`;ctx.fillStyle=j.text||'#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(j.number,0,(torsoY+th/2)*s);ctx.restore();}
  if(o.stripes){for(let sx=-tw/2+1;sx<tw/2;sx+=4)R(sx,torsoY,2,th,'#111');}
  if(o.circle){ctx.fillStyle=OL;ctx.beginPath();ctx.arc(0,torsoY+th/2,5.5,0,7);ctx.fill();ctx.fillStyle=o.circle.color;ctx.beginPath();ctx.arc(0,torsoY+th/2,4.6,0,7);ctx.fill();
    ctx.save();ctx.scale((flip?-1:1)/s,1/s);ctx.font=`bold ${Math.round(4.6*s)}px 'Bangers',Impact,sans-serif`;ctx.fillStyle=o.circle.textColor||'#111';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(o.circle.text||'',0,(torsoY+th/2+0.3)*s);ctx.restore();}
  if(o.vest){R(-tw/2,torsoY,4,th,'#111');R(tw/2-4,torsoY,4,th,'#111');}
  if(o.chain){R(-3,torsoY+1,6,1,'#d8d8d8');R(-4,torsoY+2,1,2,'#d8d8d8');R(3,torsoY+2,1,2,'#d8d8d8');R(-1,torsoY+4,3,3,'#eee');R(0,torsoY+5,1,1,'#e0202a');}
  // ---- front arm
  if(scared){O(-tw/2-3,armY-14,4,16,hurt?'#fff':(o.sleeve||topC));O(-tw/2-3,armY-18,4,4,o.gloves||skin);O(tw/2-1,armY-14,4,16,hurt?'#fff':(o.sleeve||topC));O(tw/2-1,armY-18,4,4,o.gloves||skin);}
  else if(atk>0){
    const ext=Math.round(atk*7);
    O(tw/2-2,armY+1,8+ext,4,hurt?'#fff':(o.sleeve||topC));O(tw/2+6+ext,armY,4,5,o.gloves||skin);
    if(o.mic){R(tw/2+10+ext,armY-1,3,7,'#2b2b2b');O(tw/2+9+ext,armY-5,5,5,'#bdbdbd');R(tw/2+10+ext,armY-4,3,3,'#888');}
  }else{
    O(tw/2-1,armY,4,9,hurt?'#fff':(o.sleeve||topC));O(tw/2-1,armY+9,4,4,o.gloves||skin);
    if(o.mic){R(tw/2+1,armY+7,2,6,'#2b2b2b');O(tw/2,armY+3,4,4,'#bdbdbd');R(tw/2+1,armY+4,2,2,'#888');}
    if(o.holding==='ball'){ctx.fillStyle=OL;ctx.beginPath();ctx.arc(tw/2+4,armY+13,5,0,7);ctx.fill();ctx.fillStyle='#e8701a';ctx.beginPath();ctx.arc(tw/2+4,armY+13,4,0,7);ctx.fill();R(tw/2+4,armY+9,1,8,'#5a2a08');}
    if(o.holding==='football'){ctx.fillStyle=OL;ctx.beginPath();ctx.ellipse(tw/2+4,armY+13,6,4,0,0,7);ctx.fill();ctx.fillStyle='#7a3b12';ctx.beginPath();ctx.ellipse(tw/2+4,armY+13,5,3,0,0,7);ctx.fill();R(tw/2+2,armY+13,4,1,'#fff');}
  }
  if(hr.type==='dreads'){const len=(hr.len||18)-3,tip=hr.tip||'#e0202a';
    for(const dx of [-tw/2-1,-tw/2+2,tw/2-4,tw/2-1]){const sway=Math.round(Math.sin(walk*0.7+dx)*1);O(dx+sway,headY+7,2,len,hairC);R(dx+sway,headY+7+len-5,2,5,tip);}}
  if(o.tattoo){for(let i=0;i<4;i++){R(tw/2,armY+1+i*2,1,1,'#2a3a4a');R(-tw/2-2,armY+2+i*2,1,1,'#2a3a4a');}}
  if(hr.type==='afro'){ctx.fillStyle=OL;ctx.beginPath();ctx.arc(0,headY+3,headW/2+6,0,7);ctx.fill();ctx.fillStyle=hairC;ctx.beginPath();ctx.arc(0,headY+3,headW/2+5,0,7);ctx.fill();}
  // ---- head
  O(-headW/2,headY,headW,headH,skin);
  R(-headW/2,headY+headH-2,headW,2,sh(skin,0.85));
  // ears
  R(-headW/2-1,headY+6,1,3,skin);R(headW/2,headY+6,1,3,skin);
  // brows + eyes (angry hero brow)
  const ey=headY+5;
  if(scared){O(-6,ey-2,5,5,'#fff');O(1,ey-2,5,5,'#fff');R(-4,ey,2,2,'#111');R(3,ey,2,2,'#111');R(-2,ey+6,4,3,'#111');}
  else if(o.face&&o.face.shades){O(-headW/2+1,ey-1,headW-2,4,'#1a1010');R(-headW/2+2,ey,5,2,'#5a1a1a');R(1,ey,5,2,'#5a1a1a');R(-headW/2+2,ey,2,1,'#8a3a3a');R(1,ey,2,1,'#8a3a3a');R(-1,ey,2,1,'#c9a24a');}
  else{R(-5,ey-1,4,1,OL);R(2,ey-1,4,1,OL);R(-5,ey,3,2,'#fff');R(2,ey,3,2,'#fff');R(-4,ey,2,2,'#1a1a1a');R(3,ey,2,2,'#1a1a1a');}
  // nose
  R(0,ey+3,1,2,sh(skin,0.7));
  if(o.face&&o.face.ring)R(1,ey+4,1,1,'#ddd');
  // beard / goatee / mouth
  if(o.face&&o.face.beard){R(-headW/2+1,headY+8,headW-2,headH-8,'#1a1210');R(-headW/2,headY+9,1,3,'#1a1210');R(headW/2-1,headY+9,1,3,'#1a1210');R(-2,headY+9,4,1,sh(skin,0.9));}
  else if(o.face&&o.face.mustache){R(-4,headY+9,8,2,'#1a1210');R(-4,headY+10,1,2,'#1a1210');R(3,headY+10,1,2,'#1a1210');}
  else if(o.face&&o.face.lips)R(-2,headY+10,4,1,'#b03050');
  else R(-2,headY+10,4,1,sh(skin,0.6));
  if(o.face&&o.face.goatee){O(-2,headY+headH,4,4,'#1a1210');}
  // hair tops / hats
  if(hr.type==='short'||hr.type==='dreads'&&!o.hat){O(-headW/2,headY-1,headW,4,hairC);}

function updateCutscene(){
  const c=cut;const b=c.beats[c.i];if(!b){beginPlay();return;}
  if(b.u)b.u(c,c.f);c.f++;
  for(const fx of c.fx){fx.life--;if(fx.vx!==undefined){fx.x+=fx.vx;fx.y+=fx.vy;fx.vy+=fx.g||0;}}
  c.fx=c.fx.filter(fx=>fx.life>0);
  for(const l of lightning)l.t--;lightning=lightning.filter(l=>l.t>0);
  for(const q of particles){q.life--;q.x+=q.vx;q.y+=q.vy;if(!q.txt)q.vy+=0.15;}particles=particles.filter(q=>q.life>0);
  if(shake>0)shake--;
  if(c.f>=b.d||tapQueue.length||pressed('start')||pressed('jump')){tapQueue=[];c.i++;c.f=0;const nb=c.beats[c.i];if(nb&&nb.s)nb.s();if(!nb)beginPlay();}
}

function triggerAssist(i){
  const sp=L.assists[i];const p=player;msg=sp.name+'!';msgT=70;flash=6;

  const kind=sp.key;
  if(kind==='keg'){h.update=h=>{h.moving=h.t<40||h.t>80;if(h.t<40){h.x+=5;h.walk+=0.3;}else if(h.t===40){h.attack=1;}else if(h.t===52){projs.push({x:h.x+40,y:h.y-60,z:h.z,vx:8,vy:-9,type:'keg',friendly:true,partner:true,assist:true,life:160,dmg:4,grav:0.45,rot:0});}else if(h.t>80){h.x-=5;h.walk+=0.3;h.face=-1;if(h.x<camX-60)h.done=true;}if(h.attack>0)h.attack-=0.045;};}
  else if(kind==='micdrop'){
    if(boss&&!boss.dead){boss.scared=240;boss.charge=0;boss.cd=240;floatText(boss.x,boss.y-170,'!!!','#fff');}
    const cands=enemies.filter(e=>!e.dead&&!e.grabbed);const tgt=cands.length?cands[Math.floor(Math.random()*cands.length)]:null;
    if(tgt){tgt.grabbed=true;tgt.hp=Math.max(tgt.hp,1);}
    h.update=h=>{
      if(!tgt){h.moving=true;h.x+=5;h.walk+=0.3;h.attack=h.t%10<5?1:0;if(h.x>camX+W+80)h.done=true;return;}
      if(h.t<40){h.moving=true;h.x+=(tgt.x-50-h.x)*0.15;h.z=tgt.z;h.y=h.z;h.walk+=0.35;}
      else{h.moving=false;h.z=tgt.z;h.y=h.z;h.face=1;h.x=tgt.x-46;tgt.x+=2.6;tgt.z=h.z;tgt.y=tgt.z;tgt.face=-1;tgt.crouch=1;tgt.hurt=2;tgt.stun=2;tgt.charge=0;h.attack=(h.t%8<4)?1:0.3;

    };}

function pickFrame(e){
  if(e.frame)return e.frame;
  const spf=SPRITES[e.o.sprite].frames;
  if(e.down>0&&spf.down)return (e.down<14&&spf.getup)?'getup':'down';
  if(e.turbo>0&&spf.turbo1)return t%8<4?'turbo1':'turbo2';
  if(e.hurt>0)return (e.air&&spf.knockback)?'knockback':'hit';
  if(e===player&&win&&spf.victory)return 'victory';
  if(e.superK>0&&spf.firekick2)return 'firekick2';
  if(e.superP>0&&spf.micblast)return 'micblast';
  if(e.kick>0&&e.air&&spf.airkick)return 'airkick';
  if((e.chargeK||0)>=60&&spf.fcharge1)return t%10<5?'fcharge1':'fcharge2';
  if((e.chargeP||0)>=60&&spf.mcharge1)return t%10<5?'mcharge1':'mcharge2';
  if(e.crouch&&spf.duck)return ((e.duckT||0)<5&&spf.duck0)?'duck0':'duck';
  if(e.charging&&SPRITES[e.o.sprite].frames.charge)return 'charge';
  if(e.kick>0)return 'kick';
  if(e.attack>0.55&&e.o.sprite&&SPRITES[e.o.sprite].frames.lift)return 'lift';
  if(e.attack>0)return 'punch';
  if(e.air)return 'jump';
  const sp=SPRITES[e.o.sprite];
  if(Math.abs(e.vx||0)>0.8||e.moving){const w=sp.walk||['walk1','walk2'];return w[Math.floor(e.walk*1.6)%w.length];}
  if(sp.idleCycle){return sp.idleCycle[Math.floor(t/(sp.idleRate||30))%sp.idleCycle.length];}
  return 'idle';
}

// ---------------- menus ----------------
const MENU={items:[],hit(x,y){for(const it of this.items)if(x>=it.x&&x<=it.x+it.w&&y>=it.y&&y<=it.y+it.h)return it;return null;}};
function button(x,y,w,h,label,id,c){MENU.items.push({x,y,w,h,id});ctx.fillStyle=c||'#e0202a';roundRect(x,y,w,h,12);ctx.fill();ctx.strokeStyle='#000';ctx.lineWidth=3;ctx.stroke();outlined(label,x+w/2,y+h/2,Math.min(28,h*0.55),'#fff');}
function bgStars(){ctx.fillStyle='#0b0b0e';ctx.fillRect(0,0,W,H);for(let i=0;i<50;i++){const x=(i*97+t*0.5)%W,y=(i*53)%H;ctx.fillStyle=i%3?'#1c1c24':'#2a1a1e';ctx.fillRect(x,y,3,3);}}
function drawTitle(){
  bgStars();MENU.items=[];
  ctx.save();ctx.translate(W/2,H/2-40);ctx.rotate(t/60);ctx.fillStyle='#161616';ctx.beginPath();ctx.arc(0,0,150,0,7);ctx.fill();for(let r=40;r<150;r+=12){ctx.strokeStyle=r%24?'#1f1f1f':'#2a2a2a';ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.stroke();}ctx.fillStyle='#e0202a';ctx.beginPath();ctx.arc(0,0,38,0,7);ctx.fill();ctx.restore();
  drawEntity({o:CHARS[charKey].o,x:camX+W/2-250,y:GROUND-10,face:1,walk:t/8,moving:true,vx:1,attack:0,kick:0,hurt:0});
  outlined('TONE DA BOSS PRESENTS',W/2,130,30,'#fff');
  outlined('QUEST OF',W/2,200,70,'#e0202a');outlined('CHAMPIONS',W/2,270,96,'#f2c94c');
  if(t%60<40)outlined('TAP TO START',W/2,370,34,'#fff');
  outlined('Arrows/WASD move · J punch · K kick · S duck · Space jump · 1/2 assists · T turbo · Enter pause · Shift menu',W/2,500,16,'#888');
  outlined('T1 ENTERTAINMENT · CEDAR RAPIDS, IOWA',W/2,525,14,'#666');
}
function drawCharSelect(){
  bgStars();MENU.items=[];outlined('SELECT YOUR CHAMPION',W/2,50,48,'#e0202a');
  const keysC=Object.keys(CHARS);const cw=Math.min(170,Math.floor((W-20)/keysC.length));const x0=W/2-(keysC.length*cw)/2;
  keysC.forEach((k,i)=>{const c=CHARS[k];const x=x0+i*cw+10,y=90;const sel=k===charKey;
    ctx.fillStyle=sel?'#2a1016':'#15151b';roundRect(x,y,cw-20,330,14);ctx.fill();ctx.strokeStyle=sel?'#f2c94c':'#333';ctx.lineWidth=sel?4:2;ctx.stroke();MENU.items.push({x,y,w:cw-20,h:330,id:'char:'+k});
    outlined(c.name,x+(cw-20)/2,y+26,c.name.length>9?14:20,sel?'#f2c94c':'#fff');
    drawEntity({o:c.o,x:camX+x+(cw-20)/2,y:y+280,face:1,walk:sel?t/8:0,moving:sel,vx:sel?1:0,attack:0,kick:0,hurt:0});
    text(c.tag,x+(cw-20)/2,y+310,11,'#aaa','center','body');});
  button(W/2-120,450,240,56,'PICK LEVEL →','go');
}
function drawLevelSelect(){
  bgStars();MENU.items=[];outlined('PICK YOUR LEVEL',W/2,50,48,'#e0202a');
  [1,2,3].forEach((n,i)=>{const Lv=LEVELS[n];const x=W/2-300+i*300;const open=n<=save.unlocked;
    ctx.fillStyle=open?'#15151b':'#0f0f12';roundRect(x-135,85,270,380,14);ctx.fill();ctx.strokeStyle=open?'#e0202a':'#333';ctx.lineWidth=3;ctx.stroke();
    outlined('LEVEL '+n,x,115,26,open?'#f2c94c':'#555');outlined(Lv.name,x,150,30,open?'#fff':'#555');
    if(open){drawEntity({o:CHARS[charKey].o,x:camX+x-50,y:320,face:1,walk:t/8,moving:true,vx:1,attack:0,kick:0,hurt:0});
      if(save.beaten[n])drawEntity({o:Lv.team.o,x:camX+x+50,y:320,face:1,walk:t/8+1,moving:true,vx:1,attack:0,kick:0,hurt:0});else outlined('?',x+50,250,60,'#333');
      button(x-110,345,220,44,'PLAY SOLO','play:'+n);
      if(save.beaten[n])button(x-110,398,220,44,'WITH '+Lv.team.name,'team:'+n,'#1d428a');else text('Beat it once to unlock '+Lv.team.name,x,420,11,'#888','center','body');}
    else outlined('LOCKED',x,280,40,'#444');});
  button(W/2-100,480,200,44,'← CHAMPION','back','#333');
}
function drawPaused(){drawPlay();ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);MENU.items=[];outlined('PAUSED',W/2,110,72,'#f2c94c');button(W/2-260,170,240,56,'RESUME','resume');button(W/2+20,170,240,56,'QUIT TO MENU','quit','#333');text('Watch, stream and follow '+CHARS[charKey].name+':',W/2,370,16,'#ddd','center','body');drawEntity({o:CHARS[charKey].o,x:camX+110,y:360,face:1,walk:t/8,moving:true,vx:1,attack:0,kick:0,hurt:0});}
function drawSelectMenu(){drawPlay();ctx.fillStyle='rgba(0,0,0,0.8)';ctx.fillRect(0,0,W,H);MENU.items=[];outlined('SELECT MENU',W/2,50,54,'#f2c94c');
  button(W/2-320,90,300,52,'RESUME GAME','resume');button(W/2+20,90,300,52,'CHANGE CHARACTER','tochar','#1d428a');
  button(W/2-320,152,300,52,'RESTART LEVEL','retry','#6a1aa0');button(W/2+20,152,300,52,'QUIT TO MENU','quit','#333');
  outlined(CHARS[charKey].name,W/2,250,30,'#fff');text('Watch the video, stream the song, and follow on Instagram, TikTok, Spotify, Apple Music and more:',W/2,370,15,'#ddd','center','body');
  drawEntity({o:CHARS[charKey].o,x:camX+110,y:380,face:1,walk:t/8,moving:true,vx:1,attack:0,kick:0,hurt:0});}
function drawVictory(){
  bgStars();MENU.items=[];
  for(let i=0;i<40;i++){const a=t/30+i;ctx.fillStyle=['#e0202a','#f2c94c','#fff'][i%3];ctx.fillRect(480+Math.cos(a)*(150+i*6),200+Math.sin(a*1.3)*(110+i*2),4,4);}
  // left: your champion
  outlined(CHARS[charKey].name,150,40,24,'#f2c94c');
  drawEntity({o:CHARS[charKey].o,x:camX+150,y:330,face:1,walk:t/8,moving:true,vx:1,attack:0,kick:0,hurt:0});
  if(withTeam)drawEntity({o:L.team.o,x:camX+250,y:330,face:1,walk:t/8+1,moving:true,vx:1,attack:0,kick:0,hurt:0});
  outlined('YOU GOT IT!',200,380,40,'#f2c94c');
  // center: artwork (or the embedded video for this level)
  ctx.fillStyle='#15151b';roundRect(330,16,300,169,12);ctx.fill();ctx.strokeStyle='#f2c94c';ctx.lineWidth=3;ctx.stroke();
  if(!EMBED_VIDEO[level]){const rw=L.reward;ctx.save();ctx.translate(480,100);ctx.scale(0.75,0.75);
    if(rw==='ring'){ctx.strokeStyle='#f2c94c';ctx.lineWidth=22;ctx.beginPath();ctx.arc(0,30,60,0,7);ctx.stroke();ctx.fillStyle='#f2c94c';ctx.beginPath();ctx.moveTo(-50,-40);ctx.lineTo(50,-40);ctx.lineTo(70,-10);ctx.lineTo(0,10);ctx.lineTo(-70,-10);ctx.closePath();ctx.fill();ctx.fillStyle='#e0202a';ctx.beginPath();ctx.arc(0,-18,16,0,7);ctx.fill();}
    else{ctx.fillStyle='#111';ctx.fillRect(-120,-20,240,60);ctx.fillStyle='#f2c94c';ctx.beginPath();ctx.ellipse(0,10,60,36,0,0,7);ctx.fill();ctx.fillStyle='#e0202a';ctx.beginPath();ctx.arc(0,10,20,0,7);ctx.fill();}
    ctx.restore();}
  outlined(L.name,480,210,28,'#fff');
  outlined(`SCORE ${String(score).padStart(6,'0')}`,480,248,26,'#f2c94c');outlined(`Records ${collected}   Lives ${lives}`,480,278,18,'#fff');
  drawScores(480,320);
  // right: actions
  if(justUnlocked&&t%40<30)outlined('NEXT LEVEL UNLOCKED!',800,30,26,'#e0202a');
  button(660,52,280,50,level<3?'NEXT LEVEL →':'MAIN MENU','next');button(660,112,280,50,'WITH '+L.team.name,'team:'+level,'#1d428a');button(660,172,280,50,'PLAY AGAIN SOLO','solo:'+level,'#333');
  text('Links below: watch, stream, follow.',800,245,13,'#aaa','center','body');
}
function drawGameOver(){
  bgStars();MENU.items=[];
  outlined(CHARS[charKey].name,150,40,24,'#aaa');
  if(CHARS[charKey].o.sprite&&SPRITES[CHARS[charKey].o.sprite].frames.down)drawEntity({o:CHARS[charKey].o,x:camX+150,y:330,face:1,down:99,walk:0,attack:0,kick:0,hurt:0});
  else{ctx.save();ctx.translate(150,330);ctx.rotate(-1.5);ctx.translate(-150,-330);drawEntity({o:CHARS[charKey].o,x:camX+150,y:330,face:1,walk:0,moving:false,vx:0,attack:0,kick:0,hurt:1});ctx.restore();}
  if(level===3){for(let i=0;i<4;i++){const o=LEVELS[3].enemy.kinds[i%3].o;drawEntity({o,x:camX+330+i*110,y:330,face:-1,walk:0,attack:1,kick:0,hurt:0});outlined('HA HA',330+i*110,150+Math.sin(t/6+i)*6,20,'#fff');outlined('☝',330+i*110,120,34,'#fff');}}
  outlined('NOT TODAY',470,level===3?60:120,54,'#e0202a');
  outlined(`SCORE ${String(score).padStart(6,'0')}`,800,180,24,'#f2c94c');drawScores(800,230);
  button(660,30,280,52,'RUN IT BACK','retry');button(660,92,280,52,'MAIN MENU','quit','#333');
}
// ---------------- high scores (top 3, stored on this device) ----------------
let entry=null;
function checkHighScore(){const list=save.scores.slice().sort((a,b)=>b.s-a.s);if(list.length<3||score>list[2].s){entry={name:'',pending:true};}}
function drawScores(x,y){const list=save.scores.slice().sort((a,b)=>b.s-a.s).slice(0,3);if(!list.length)return;outlined('TOP CHAMPIONS',x,y,18,'#f2c94c');list.forEach((r,i)=>outlined(`${i+1}. ${r.name}  ${String(r.s).padStart(6,'0')}  L${r.l}`,x,y+22+i*20,15,'#fff'));}
const KEYS_ROWS=['ABCDEFGHIJ','KLMNOPQRST','UVWXYZ0123','456789 ⌫✓'];
function drawEntry(){
  bgStars();MENU.items=[];outlined('NEW HIGH SCORE!',W/2,50,54,'#f2c94c');outlined(String(score).padStart(6,'0'),W/2,105,40,'#fff');
  outlined('ENTER YOUR NAME',W/2,150,22,'#aaa');
  rect(W/2-160,170,320,48,'#15151b');outlined(entry.name+(t%40<20?'_':''),W/2,194,34,'#fff');
  KEYS_ROWS.forEach((row,r)=>{[...row].forEach((ch,c)=>{const x=W/2-250+c*50,y=240+r*58;button(x,y,44,48,ch,'key:'+ch,ch==='✓'?'#1d8a3a':(ch==='⌫'?'#333':'#2a2a36'));});});
}
function entryKey(ch){if(ch==='⌫')entry.name=entry.name.slice(0,-1);else if(ch==='✓'){if(entry.name.trim().length){save.scores.push({name:entry.name.trim(),s:score,l:level});save.scores=save.scores.sort((a,b)=>b.s-a.s).slice(0,3);persist();}entry=null;state='victory';stopMusic();showLinks('victory');if(EMBED_VIDEO[level])showVideo(EMBED_VIDEO[level],[330,16,300,169]);}else if(entry.name.length<8)entry.name+=ch;}
window.addEventListener('keydown',e=>{if(state!=='entry')return;if(e.key==='Backspace')entryKey('⌫');else if(e.key==='Enter')entryKey('✓');else if(/^[a-zA-Z0-9 ]$/.test(e.key))entryKey(e.key.toUpperCase());});

// ---------------- main loop ----------------
function handleMenuTap(it){
  const id=it.id;
  if(state==='title'){state='charselect';}
  else if(state==='charselect'){if(id.startsWith('char:'))charKey=id.slice(5);else if(id==='go')state='levels';}
  else if(state==='levels'){if(id==='back')state='charselect';else if(id.startsWith('play:'))startLevel(+id.slice(5),false);else if(id.startsWith('team:'))startLevel(+id.slice(5),true);}
  else if(state==='paused'||state==='selectmenu'){if(id==='resume'){state='play';hideLinks();try{music.play();}catch(e){}}else if(id==='quit'){state='levels';hideLinks();menuMusic();}else if(id==='tochar'){state='charselect';hideLinks();menuMusic();}else if(id==='retry'){hideLinks();startLevel(level,withTeam);}}
  else if(state==='victory'){if(id.startsWith('team:'))startLevel(level,true);else if(id.startsWith('solo:'))startLevel(level,false);else if(id==='next'){hideLinks();if(level<3)startLevel(level+1,false);else{state='levels';menuMusic();}}}
  else if(state==='gameover'){if(id==='retry')startLevel(level,withTeam);else if(id==='quit'){state='levels';hideLinks();menuMusic();}}
  else if(state==='entry'){if(id.startsWith('key:'))entryKey(id.slice(4));}
}
function frame(){
  let toggled=false;
  if(state==='play'){update();
    if(pressed('start')){state='paused';stopMusic();showLinks('select');toggled=true;}
    else if(pressed('select')){state='selectmenu';stopMusic();showLinks('select');toggled=true;}}
  else if(state==='cutscene')updateCutscene();
  else{t++;}
  if(state==='victory'&&entry&&entry.pending){entry.pending=false;state='entry';hideLinks();}
  if(state==='title')drawTitle();else if(state==='charselect')drawCharSelect();else if(state==='levels')drawLevelSelect();
  else if(state==='cutscene')drawCutscene();else if(state==='play')drawPlay();else if(state==='paused')drawPaused();else if(state==='selectmenu')drawSelectMenu();
  else if(state==='victory')drawVictory();else if(state==='gameover')drawGameOver();else if(state==='entry')drawEntry();
  if(!toggled&&state==='paused'&&pressed('start')){state='play';hideLinks();try{music.play();}catch(e){}}
  if(!toggled&&state==='selectmenu'&&pressed('select')){state='play';hideLinks();try{music.play();}catch(e){}}
  if(state!=='play'&&state!=='cutscene'){
    if(tapQueue.length){const tp=tapQueue.shift();tapQueue=[];const it=MENU.hit(tp[0],tp[1]);if(it)handleMenuTap(it);else if(state==='title')handleMenuTap({id:'start'});}
    else if(state==='title'&&(pressed('jump')||pressed('start')))handleMenuTap({id:'start'});
    if(state==='title'&&music.paused&&!menuSongFailed&&t%30===0)menuMusic();
  }
  if(pressed('mute'))toggleMute();drawMute();
  endFrameInput();requestAnimationFrame(frame);
}
frame();
</script>
