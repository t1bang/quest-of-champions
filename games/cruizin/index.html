<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cruizin IA</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d12; overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff; }
  #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; background: #0b0d12; outline: none; }
  #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: radial-gradient(circle at 50% 40%, #2a1608, #0b0d12 70%); text-align: center; padding: 16px; }
  #boot h1 { margin: 0; font-size: clamp(34px, 7vw, 76px); letter-spacing: .04em; color: #ff7a1a; text-shadow: 0 4px 0 #000; font-style: italic; }
  #boot p { margin: 0; opacity: .8; font-size: 15px; }
  #bar { width: min(420px, 80vw); height: 12px; border-radius: 8px; background: #25282f; overflow: hidden; }
  #fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ff7a1a, #ffd23e); transition: width .15s linear; }
  #msg { min-height: 1.2em; font-size: 13px; opacity: .7; }
  #err { color: #ff8a8a; max-width: 640px; white-space: pre-wrap; font-size: 13px; }
</style>
</head>
<body>
<canvas id="unity-canvas" tabindex="0"></canvas>
<div id="boot">
  <h1>CRUIZIN IA</h1>
  <p>Cedar Rapids · I-380</p>
  <div id="bar"><div id="fill"></div></div>
  <div id="msg">Loading the city…</div>
  <div id="err"></div>
</div>
<script>
  const canvas = document.getElementById("unity-canvas");
  const boot = document.getElementById("boot");
  const fill = document.getElementById("fill");
  const msg = document.getElementById("msg");
  const err = document.getElementById("err");
  const buildUrl = "Build";
  const config = {
    dataUrl: buildUrl + "/cruizin.data.br",
    frameworkUrl: buildUrl + "/cruizin.framework.js.br",
    codeUrl: buildUrl + "/cruizin.wasm.br",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "Big Bang Arcade",
    productName: "CruzinIA — I-380 Sprint",
    productVersion: "1.0",
    devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.25),
    showBanner: (text, type) => { if (type === "error") err.textContent += text + "\n"; else console.warn(text); }
  };
  const loader = document.createElement("script");
  loader.src = buildUrl + "/cruizin.loader.js";
  loader.onload = () => {
    createUnityInstance(canvas, config, p => {
      fill.style.width = Math.round(p * 100) + "%";
      if (p > 0.9) msg.textContent = "Building the roads…";
    }).then(instance => {
      window.cruizin = instance;
      boot.remove();
      canvas.focus();
    }).catch(e => { err.textContent += (e && e.message ? e.message : e) + "\n"; msg.textContent = "Could not start."; });
  };
  loader.onerror = () => { msg.textContent = "Could not load the game files."; };
  document.body.appendChild(loader);
  addEventListener("pointerdown", () => canvas.focus());
  // keep arrow keys / space from scrolling the arcade page behind the game
  addEventListener("keydown", e => { if ([" ", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) e.preventDefault(); });
</script>
</body>
</html>
