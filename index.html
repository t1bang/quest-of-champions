<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Big Bang Arcade</title>
<meta name="description" content="Walk the Big Bang Arcade: Quest of Champions, T1 Versus, Gorilla City 2032, Gamer Boyz and Blankman: The Game. Win tokens, hit the prize wall, run the jukebox.">
<meta name="theme-color" content="#0b0612">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Big Bang Arcade">
<meta property="og:url" content="https://bigbangarcade.com/">
<meta property="og:title" content="Big Bang Arcade">
<meta property="og:description" content="Free browser games from T1 Entertainment. Walk the arcade, pick a cabinet and press start.">
<meta property="og:image" content="https://bigbangarcade.com/assets/share.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Big Bang Arcade: a neon arcade room with game cabinets and a prize wall">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Big Bang Arcade">
<meta name="twitter:description" content="Free browser games from T1 Entertainment. Walk the arcade, pick a cabinet and press start.">
<meta name="twitter:image" content="https://bigbangarcade.com/assets/share.jpg">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="view"></canvas>

<header id="hud">
  <div class="logo">BIG BANG<span>ARCADE</span></div>
  <div class="hudr">
    <button id="tok" title="Your tokens">🪙 <b>0</b></button>
    <button id="who" aria-label="My Big Bang Arcade account">GUEST</button>
    <button id="map">MAP</button>
    <button id="vr" hidden aria-label="Enter virtual reality">VR</button>
    <button id="snd" aria-label="Music on or off">♪</button>
  </div>
</header>
<button id="featured" aria-label="Open My Arcade"><span>MY ARCADE</span> GAMES + SCORES <b>↗</b></button>
<div id="hint">DRAG TO LOOK · TAP A MACHINE TO WALK UP</div>
<button id="act" hidden></button>
<div id="stick" aria-hidden="true"><i></i></div>

<div id="panel" hidden><div class="box"><button class="x" aria-label="Close">✕</button><div id="pbody"></div></div></div>

<div id="gf" hidden>
  <div class="gfbar"><b></b><a target="_blank" rel="noopener">OPEN IN NEW TAB</a><button>✕ EXIT GAME</button></div>
  <iframe title="Arcade game" allow="autoplay; fullscreen; gamepad"></iframe>
</div>

<div id="gate">
  <div class="gbox">
    <div class="glogo">BIG BANG<span>ARCADE</span></div>
    <input id="gname" maxlength="16" placeholder="PLAYER NAME" autocomplete="off">
    <button id="genter">ENTER THE ARCADE</button>
    <p class="gfoot" style="margin:14px 0 0;font:11px/1.5 system-ui,sans-serif;color:#b9a9d6;text-align:center">Free browser games from T1 Entertainment. Sign in to save scores, tokens and your avatar across every game.<br><a href="/privacy.html" style="color:#ffc93a">Privacy policy</a></p>
  </div>
</div>
<div id="toast"></div>
<audio id="song"></audio>
<script type="module" src="app.js"></script>
<script src="https://cruizin.chucksi.com/hub.js" data-game="arcade" data-ready="manual" async></script>
</body>
</html>
